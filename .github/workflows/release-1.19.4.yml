name: Release 1.19.4

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        required: true
        default: server-replay-1.19.4
  push:
    tags:
      - '1.19.4*'
      - 'v*1.19.4*'
      - 'server-replay-1.19.4*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/wrapper-validation-action@v1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: ./gradlew build --stacktrace --no-daemon

      - name: Upload release jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | sort)
          if [ "${#jars[@]}" -eq 0 ]; then
            echo "No release jar found in build/libs"
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${jars[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${jars[@]}" \
              --target "$GITHUB_SHA" \
              --title "ServerReplay 1.19.4 - $RELEASE_TAG" \
              --notes "Automated ServerReplay 1.19.4 build from $GITHUB_SHA."
          fi
